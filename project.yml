name: CacaoPhotoSlide
options:
  bundleIdPrefix: com.ictcacao
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  # 写真のフォルダをドロップすると全画面のスライドショーにする。音楽なし。既定は Ken Burns
  CacaoPhotoSlide:
    type: application
    platform: macOS
    sources:
      - path: CacaoPhotoSlide
        excludes:
          - "Resources/*.plist"
      - path: LICENSE
        buildPhase: resources
    info:
      path: CacaoPhotoSlide/Resources/Info.plist
      properties:
        CFBundleDisplayName: CacaoPhotoSlide
        CFBundleName: CacaoPhotoSlide
        CFBundleShortVersionString: "1.0.3"
        CFBundleVersion: "1.0.3"
        LSMinimumSystemVersion: "14.0"
        CFBundleDevelopmentRegion: ja
        CFBundleLocalizations: [ja, en]
        LSApplicationCategoryType: public.app-category.photography
        NSHumanReadableCopyright: "© 2026 ICTCacao"
        # 書類 .cpsd（フォルダ形式のパッケージ）と、Dock のアイコンに落とせるフォルダ・画像・音声
        CFBundleDocumentTypes:
          - CFBundleTypeName: CacaoPhotoSlide スライドショー
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSTypeIsPackage: true
            LSItemContentTypes: [com.ictcacao.cacaophotoslide.cpsd]
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
            LSItemContentTypes: [public.audio]
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
            LSItemContentTypes: [public.folder]
          - CFBundleTypeName: Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
            LSItemContentTypes: [public.image]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.ictcacao.cacaophotoslide.cpsd
            UTTypeDescription: CacaoPhotoSlide スライドショー
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [cpsd]
    # 好きな場所の写真を読むため、サンドボックスは使わない
    entitlements:
      path: CacaoPhotoSlide/Resources/CacaoPhotoSlide.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ictcacao.CacaoPhotoSlide
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  CacaoPhotoSlide:
    build:
      targets:
        CacaoPhotoSlide: all
    run:
      config: Debug
